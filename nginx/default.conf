worker_processes auto;
worker_rlimit_nofile 100000;

events {
    worker_connections 20480;
    multi_accept on;
    use epoll;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;

    # Gzip Compression to minimize mobile network payload sizes and reduce latency
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1024;

    # Buffer client bodies in RAM so slow mobile cellular/Wi-Fi uploads do not tie up FastAPI workers
    client_body_buffer_size 16m;
    client_max_body_size 100m;
    client_header_timeout 60s;
    client_body_timeout 120s;
    send_timeout 60s;

    upstream api_backend {
        server api:8000;
        keepalive 128;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name cair-ms-7e06.tail49e3b1.ts.net attendai.sachinmaurya.me localhost "";
        client_max_body_size 100m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 512k;
            proxy_request_buffering on;
        }
    }
}
