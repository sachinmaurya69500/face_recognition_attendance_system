services:
  # Keep this file runnable by itself as well as an override for
  # docker-compose.yml. The API uses the service name "db" below.
  db:
    image: pgvector/pgvector:pg16
    container_name: attendance_pgvector_db
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    gpus: all
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      REQUIRE_GPU: "1"
      INFERENCE_PROVIDERS: CUDAExecutionProvider,CPUExecutionProvider
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - insightface_models:/workspace/models
      - ./backend/app:/workspace/app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: attendance_nginx
    restart: always
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  pgdata:
  insightface_models:
