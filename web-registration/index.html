<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>FaceAttend Registration</title></head><body><div id="root"><main style="font-family:system-ui;padding:40px"><h1>FaceAttend</h1><p>Loading registration portal…</p></main></div><script>window.addEventListener('error',function(e){document.getElementById('root').innerHTML='<main style="font-family:system-ui;padding:40px"><h1>FaceAttend startup error</h1><pre>'+String(e.error||e.message)+'</pre></main>'});window.addEventListener('unhandledrejection',function(e){document.getElementById('root').innerHTML='<main style="font-family:system-ui;padding:40px"><h1>FaceAttend startup error</h1><pre>'+String(e.reason)+'</pre></main>'});</script><script type="module" src="/src/main.tsx"></script></body></html>
