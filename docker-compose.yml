services:
  # 1. PostgreSQL Database with Vector Search
  db:
    image: pgvector/pgvector:pg16
    container_name: attendance_pgvector_db
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI AI Inference Service (SCRFD + ArcFace, GPU required)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
    container_name: attendance_fastapi_server
    restart: always
    gpus: all
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      REQUIRE_GPU: "1"
      INFERENCE_PROVIDERS: CUDAExecutionProvider,CPUExecutionProvider
    volumes:
      - insightface_models:/workspace/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Public entry point for phones, emulators, and browser clients.
  nginx:
    image: nginx:1.27-alpine
    container_name: attendance_nginx
    restart: always
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro
    ports:
      # Loopback by default. Set NGINX_BIND_ADDRESS=0.0.0.0 only for an
      # intentional LAN test with a phone; PostgreSQL and FastAPI stay private.
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-8080}:80"

volumes:
  pgdata:
  insightface_models:
